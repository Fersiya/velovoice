[package]
name = "velovoice"
version = "0.1.0"
description = "Lightweight Rust + Tauri 2.0 voice & 1080p60 screen share client"
authors = ["VeloVoice"]
edition = "2021"

[lib]
name = "velovoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
