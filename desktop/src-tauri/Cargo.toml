[package]
name = "velovoice"
version = "0.2.0"
description = "VeloVoice 2.0 — Ultra-lightweight Rust + Tauri 2.0 Discord alternative"
authors = ["VeloVoice"]
edition = "2021"

[lib]
name = "velovoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.33"
local-ip-address = "0.6"

[profile.release]
panic = "abort"
lto = "thin"
opt-level = "s"
strip = true
