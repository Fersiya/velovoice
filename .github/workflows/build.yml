name: Build VeloVoice (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server -> target
            desktop/src-tauri -> target

      - name: Build Signaling Server
        working-directory: server
        run: cargo build --release

      - name: Build Desktop Client & Installers (Tauri 2)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VeloVoice-Windows
          path: |
            server/target/release/velovoice-server.exe
            desktop/src-tauri/target/release/velovoice.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VeloVoice (Latest Build)
          files: |
            server/target/release/velovoice-server.exe
            desktop/src-tauri/target/release/velovoice.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
